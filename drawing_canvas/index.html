<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draw an annotation</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px system-ui, sans-serif; color: var(--text, #e8eaf0);
      background: var(--background, #0f1117); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; padding: 4px 0 8px; }
    label { display: grid; gap: 4px; font-size: 12px; }
    button, select { font: inherit; padding: 7px 10px; border-radius: 7px;
      border: 1px solid #718096; color: inherit; background: var(--surface, #1e2130); }
    button { cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, select:focus-visible, svg:focus-visible { outline: 3px solid #4aa3ff; }
    #save { background: #17663e; color: white; }
    #help, #status { margin: 4px 0 8px; line-height: 1.4; }
    #status { min-height: 20px; }
    svg { width: 100%; height: auto; max-height: 520px; display: block;
      background: #111; border-radius: 8px; touch-action: none; cursor: crosshair;
      user-select: none; -webkit-user-select: none; }
    svg > * { pointer-events: none; }
    .outline { vector-effect: non-scaling-stroke; stroke-width: 2.5; }
    #guide { stroke-dasharray: 5 4; fill: none; }
  </style>
</head>
<body>
<main id="root">
  <div class="toolbar">
    <label>Shape<select id="tool"><option value="polygon">Polygon</option>
      <option value="freehand">Freehand</option><option value="rectangle">Rectangle</option></select></label>
    <label>Sensitivity<select id="sensitivity"><option value="auto">Auto — CLIP suggestion</option>
      <option value="sensitive">Sensitive</option>
      <option value="non_sensitive">Non-sensitive</option></select></label>
    <button id="undo" type="button" disabled>Undo point</button>
    <button id="clear" type="button" disabled>Clear</button>
    <button id="save" type="button" disabled>Save region</button>
  </div>
  <p id="help"></p>
  <svg id="surface" xmlns="http://www.w3.org/2000/svg" tabindex="0" role="img"
       aria-label="Draw a region over the image">
    <image id="image" x="0" y="0" preserveAspectRatio="none"/>
    <polygon id="fill" class="outline" fill-opacity="0.24"/>
    <polyline id="line" class="outline" fill="none"/>
    <polyline id="guide" class="outline"/>
    <g id="vertices"></g>
  </svg>
  <p id="status" role="status" aria-live="polite">Choose a shape and draw its outline.</p>
</main>
<script src="canvas.js?v=2"></script>
</body>
</html>
